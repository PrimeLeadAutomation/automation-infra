AWSTemplateFormatVersion: '2010-09-09'
Description: Monitoramento do frontend escalavel pelo ALB e Auto Scaling Group

Resources:
  FrontendDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "Frontend-ALB-Monitoring-${AWS::Region}"
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "metric",
                  "x": 0,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancerFullName}" ]
                    ],
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "title": "Requisicoes recebidas pelo ALB",
                    "period": 60
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}" ],
                      [ ".", "GroupDesiredCapacity", ".", "." ]
                    ],
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "title": "Capacidade do Auto Scaling Group",
                    "period": 60
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 6,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}" ]
                    ],
                    "view": "singleValue",
                    "region": "${AWS::Region}",
                    "title": "Instancias frontend ativas",
                    "period": 60
                  }
                }
              ]
            }
          - LoadBalancerFullName: !ImportValue FrontendLoadBalancerFullName
            AutoScalingGroupName: !ImportValue FrontendAutoScalingGroupName

  FrontendUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "Frontend-Unhealthy-Hosts-${AWS::Region}"
      AlarmDescription: Alerta quando o ALB detecta um frontend indisponivel.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TargetGroup
          Value: !ImportValue FrontendTargetGroupFullName
        - Name: LoadBalancer
          Value: !ImportValue FrontendLoadBalancerFullName
      AlarmActions:
        - !ImportValue arq-infra-alert-topic-arn
