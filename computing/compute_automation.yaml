AWSTemplateFormatVersion: '2010-09-09'
Description: Camada de Computação

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  # AMI Ubuntu 24.04 LTS da região (Canonical via SSM — amd64, hvm, gp3).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  # Ambientes de lab exigem um instance profile pré-existente (LabRole).
  Ec2InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Nome do instance profile já existente.

Resources:

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso SSH, HTTP e Grafana
      VpcId: !ImportValue VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0

  PublicInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref KeyName
      SubnetId: !ImportValue PublicSubnetId
      IamInstanceProfile: !Ref Ec2InstanceProfileName
      SecurityGroupIds:
        - !Ref SecurityGroup
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: Name
          Value: arq-infra-ec2-public
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/userdata.log) 2>&1
          
          # 1. Update do SO e Instalação do Docker
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y docker.io docker-compose-v2
          
          systemctl enable docker
          systemctl start docker
          
          until docker info >/dev/null 2>&1; do
            sleep 2
          done
          
          usermod -aG docker ubuntu || true
          
          # 2. Inicializar o Grafana (Primeiro container a subir)
          docker run -d --name grafana --restart unless-stopped -p 3000:3000 grafana/grafana:12.4.3
          
          # 3. Preparar diretório isolado para o n8n
          mkdir -p /opt/n8n
          cd /opt/n8n
          
          cat << 'EOF' > .env
          DOMAIN_NAME=localhost
          N8N_PROTOCOL=http
          N8N_PORT=5678
          GENERIC_TIMEZONE=America/Sao_Paulo
          EOF
          
          cat << 'EOF' > docker-compose.yml
          services:
            db:
              image: postgres:16-alpine
              container_name: n8n_postgres
              restart: always
              environment:
                - POSTGRES_USER=n8n_user
                - POSTGRES_PASSWORD=urubu100
                - POSTGRES_DB=n8n_database
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - n8n_network
          
            pgadmin:
              image: dpage/pgadmin4
              container_name: n8n_pgadmin
              restart: always
              environment:
                - PGADMIN_DEFAULT_EMAIL=admin@admin.com
                - PGADMIN_DEFAULT_PASSWORD=admin
              ports:
                - "8080:80"
              depends_on:
                - db
              networks:
                - n8n_network
          
            n8n:
              image: docker.n8n.io/n8nio/n8n
              container_name: n8n_app
              restart: always
              ports:
                - "80:5678"
              environment:
                - DB_TYPE=postgresdb
                - DB_POSTGRESDB_HOST=db
                - DB_POSTGRESDB_PORT=5432
                - DB_POSTGRESDB_DATABASE=n8n_database
                - DB_POSTGRESDB_USER=n8n_user
                - DB_POSTGRESDB_PASSWORD=urubu100
                - N8N_BASIC_AUTH_ACTIVE=true
                - N8N_BASIC_AUTH_USER=user
                - N8N_BASIC_AUTH_PASSWORD=password
                - N8N_HOST=${DOMAIN_NAME}
                - N8N_PORT=${N8N_PORT}
                - N8N_PROTOCOL=${N8N_PROTOCOL}
                - NODE_ENV=production
                - N8N_BLOCK_NODES=
                - N8N_BLOCK_FS_WRITE_ACCESS=false
                - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/files
                - WEBHOOK_URL=http://${DOMAIN_NAME}:80/
                - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
                - TZ=${GENERIC_TIMEZONE}
                - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
                - N8N_SECURE_COOKIE=false
              volumes:
                - n8n_data:/home/node/.n8n
                - ./local-files:/home/node/files:rw
              depends_on:
                - db
              networks:
                - n8n_network
          
          networks:
            n8n_network:
              driver: bridge
          
          volumes:
            postgres_data:
            n8n_data:
          EOF
          
          mkdir -p local-files
          chmod -R 777 local-files
          
          # Inicializar os containeres do n8n
          docker compose up -d
          
          # 4. Instalação e Configuração do CloudWatch Agent
          cd /tmp
          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          sudo dpkg -i -E ./amazon-cloudwatch-agent.deb
          
          # Criar o arquivo json de configuração do log
          cat << 'EOF' > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "/ec2/syslog",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }
          EOF
          
          # Iniciar o CloudWatch Agent
          sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config \
          -m ec2 \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
          -s

  GrafanaElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: arq-infra-eip-grafana

  GrafanaEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt GrafanaElasticIP.AllocationId
      InstanceId: !Ref PublicInstance

  PrivateInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref KeyName
      SubnetId: !ImportValue PrivateSubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: Name
          Value: arq-infra-ec2-private


Outputs:
  PublicInstanceId:
    Value: !Ref PublicInstance
    Export:
      Name: PublicInstanceId

  GrafanaPublicIp:
    Description: IP público fixo (Elastic IP) — Grafana em http://<IP>:3000
    Value: !Ref GrafanaElasticIP

  PrivateInstanceId:
    Value: !Ref PrivateInstance