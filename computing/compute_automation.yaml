AWSTemplateFormatVersion: '2010-09-09'
Description: Camada de Computação

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  # AMI Ubuntu 24.04 LTS da região (Canonical via SSM — amd64, hvm, gp3).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  # Ambientes de lab exigem um instance profile pré-existente (LabRole).
  Ec2InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Nome do instance profile já existente.
  GitHubToken:
    Type: String
    NoEcho: true
    Description: Token do GitHub com leitura nos repos back-end e database_sql.
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Senha do MySQL do backend (usuário da aplicação e root).

Resources:

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso SSH, HTTP e Grafana
      VpcId: !ImportValue VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso interno da VPC ao backend (SSH e API)
      VpcId: !ImportValue VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/24
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.0.0.0/24

  PublicInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref KeyName
      SubnetId: !ImportValue PublicSubnetId
      IamInstanceProfile: !Ref Ec2InstanceProfileName
      SecurityGroupIds:
        - !Ref SecurityGroup
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: Name
          Value: arq-infra-ec2-public
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/userdata-grafana.log) 2>&1
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          
          # Remove any old docker versions
          apt-get remove -y docker.io docker-compose docker-compose-v2 podman-docker containerd runc || true
          
          # Install Docker's official GPG key and required packages
          apt-get install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          
          # Add the repository to Apt sources
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.sources > /dev/null
          
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          
          systemctl enable --now docker
          usermod -aG docker ubuntu || true
          
          # Inicia Grafana
          docker run -d --name grafana --restart unless-stopped -p 3000:3000 grafana/grafana:12.4.3
          
          # Setup n8n
          mkdir -p /opt/n8n
          cd /opt/n8n
          
          cat << 'EOF' > .env
          DOMAIN_NAME=localhost
          N8N_PROTOCOL=http
          N8N_PORT=5678
          GENERIC_TIMEZONE=America/Sao_Paulo
          EOF
          
          cat << 'EOF' > docker-compose.yml
          services:
            db:
              image: postgres:16-alpine
              container_name: n8n_postgres
              restart: always
              environment:
                - POSTGRES_USER=n8n_user
                - POSTGRES_PASSWORD=urubu100
                - POSTGRES_DB=n8n_database
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - n8n_network
          
            pgadmin:
              image: dpage/pgadmin4
              container_name: n8n_pgadmin
              restart: always
              environment:
                - PGADMIN_DEFAULT_EMAIL=admin@admin.com
                - PGADMIN_DEFAULT_PASSWORD=admin
              ports:
                - "8080:80"
              depends_on:
                - db
              networks:
                - n8n_network
          
            n8n:
              image: docker.n8n.io/n8nio/n8n
              container_name: n8n_app
              restart: always
              ports:
                - "80:5678"
              environment:
                - DB_TYPE=postgresdb
                - DB_POSTGRESDB_HOST=db
                - DB_POSTGRESDB_PORT=5432
                - DB_POSTGRESDB_DATABASE=n8n_database
                - DB_POSTGRESDB_USER=n8n_user
                - DB_POSTGRESDB_PASSWORD=urubu100
                - N8N_BASIC_AUTH_ACTIVE=true
                - N8N_BASIC_AUTH_USER=user
                - N8N_BASIC_AUTH_PASSWORD=password
                - N8N_HOST=${!DOMAIN_NAME}
                - N8N_PORT=${!N8N_PORT}
                - N8N_PROTOCOL=${!N8N_PROTOCOL}
                - NODE_ENV=production
                - N8N_BLOCK_NODES=
                - N8N_BLOCK_FS_WRITE_ACCESS=false
                - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/files
                - WEBHOOK_URL=http://${!DOMAIN_NAME}:80/
                - GENERIC_TIMEZONE=${!GENERIC_TIMEZONE}
                - TZ=${!GENERIC_TIMEZONE}
                - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
                - N8N_SECURE_COOKIE=false
              volumes:
                - n8n_data:/home/node/.n8n
                - ./local-files:/home/node/files:rw
              depends_on:
                - db
              networks:
                - n8n_network
          
          networks:
            n8n_network:
              driver: bridge
          
          volumes:
            postgres_data:
            n8n_data:
          EOF
          
          mkdir -p local-files
          chmod -R 777 local-files
          docker compose up -d
          
          # Instalação do CloudWatch Agent
          wget https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          sudo dpkg -i -E ./amazon-cloudwatch-agent.deb
          
          # Configuração do CloudWatch Agent
          cat << 'EOF' > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "/ec2/syslog",
                      "log_stream_name": "{instance_id}"
                    },
                    {
                      "file_path": "/var/log/nginx/access.log",
                      "log_group_name": "/ec2/nginx-access",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }
          EOF
          
          # Iniciar o CloudWatch Agent
          sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config \
          -m ec2 \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
          -s

  GrafanaElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: arq-infra-eip-grafana

  GrafanaEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt GrafanaElasticIP.AllocationId
      InstanceId: !Ref PublicInstance

  PrivateInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref KeyName
      SubnetId: !ImportValue PrivateSubnetId
      SecurityGroupIds:
        - !Ref PrivateSecurityGroup
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: Name
          Value: arq-infra-ec2-private
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/userdata-backend.log) 2>&1
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y

          # Remove any old docker versions
          apt-get remove -y docker.io docker-compose docker-compose-v2 podman-docker containerd runc || true

          # Install Docker's official GPG key and required packages
          apt-get install -y ca-certificates curl git
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          # Add the repository to Apt sources
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.sources > /dev/null

          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          systemctl enable --now docker
          usermod -aG docker ubuntu || true

          # Setup backend
          mkdir -p /opt/backend
          cd /opt/backend

          set +x
          git clone https://x-access-token:${GitHubToken}@github.com/PrimeLeadAutomation/back-end.git back-end
          git clone https://x-access-token:${GitHubToken}@github.com/PrimeLeadAutomation/database_sql.git database_sql
          git -C back-end remote set-url origin https://github.com/PrimeLeadAutomation/back-end.git
          git -C database_sql remote set-url origin https://github.com/PrimeLeadAutomation/database_sql.git

          cat << 'EOF' > .env
          DB_NAME=PrimeLeadAutomation
          DB_USER=primelead_user
          DB_PASSWORD=${DbPassword}
          TZ=America/Sao_Paulo
          EOF
          chmod 600 .env
          set -x

          cat << 'EOF' > docker-compose.yml
          services:
            mysql:
              image: mysql:8.0
              container_name: backend_mysql
              restart: always
              environment:
                - MYSQL_ROOT_PASSWORD=${!DB_PASSWORD}
                - MYSQL_DATABASE=${!DB_NAME}
                - MYSQL_USER=${!DB_USER}
                - MYSQL_PASSWORD=${!DB_PASSWORD}
                - TZ=${!TZ}
              volumes:
                - mysql_data:/var/lib/mysql
                - ./database_sql/primelead_automation_script.sql:/docker-entrypoint-initdb.d/init.sql:ro
              healthcheck:
                test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 30s
              networks:
                - backend_network

            backend:
              build: ./back-end
              container_name: backend_app
              restart: always
              ports:
                - "8080:8080"
              environment:
                - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${!DB_NAME}
                - SPRING_DATASOURCE_USERNAME=${!DB_USER}
                - SPRING_DATASOURCE_PASSWORD=${!DB_PASSWORD}
                - TZ=${!TZ}
              depends_on:
                mysql:
                  condition: service_healthy
              networks:
                - backend_network

          networks:
            backend_network:
              driver: bridge

          volumes:
            mysql_data:
          EOF

          docker compose up -d --build


Outputs:
  PublicInstanceId:
    Value: !Ref PublicInstance
    Export:
      Name: PublicInstanceId

  GrafanaPublicIp:
    Description: IP público fixo (Elastic IP) — Grafana em http://<IP>:3000
    Value: !Ref GrafanaElasticIP

  PrivateInstanceId:
    Value: !Ref PrivateInstance

  PrivateInstancePrivateIp:
    Description: IP privado do backend — API em http://<IP>:8080 (apenas dentro da VPC)
    Value: !GetAtt PrivateInstance.PrivateIp